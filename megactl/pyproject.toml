[project]
name = "megactl"
version = "0.1.0"
description = "AI-powered Kubernetes CLI Assistant with TUI"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
dependencies = [
  "textual>=0.38",
  "openai>=1.0",
  "pydantic>=2.0",
  "python-decouple>=3.8",
  "rich>=13.0"
]
requires-python = ">=3.10"

[project.scripts]
megactl = "megactl.app.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
